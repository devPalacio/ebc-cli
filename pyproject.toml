[project]
name = "ebc-cli"
version = "0.1.0"
description = "A cautious terminal interface for ZKETECH EBC battery testers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jay" }]

[project.scripts]
ebc = "ebc_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ebc_cli"]
