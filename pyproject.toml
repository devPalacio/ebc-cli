[project]
name = "ebc-cli"
version = "0.1.0"
description = "A cautious terminal interface for ZKETECH EBC battery testers"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jay" }]
keywords = ["battery", "electronics", "serial", "ZKETECH", "EBC-A10H"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware",
]

[project.scripts]
ebc = "ebc_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ebc_cli"]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py314"
line-length = 100
